<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>باهم ببینیم - Stream</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at top,#252525,#080808 60%);
}

.login-card{
  width:min(440px,100%);
  padding:30px;
  border-radius:24px;
  background:#181818;
  border:1px solid #333;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
  text-align:center;
  font-size:31px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#999;
  margin-bottom:28px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#ccc;
  font-size:14px;
}

.field input{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:13px;
  border:1px solid #444;
  outline:none;
  background:#0e0e0e;
  color:#fff;
  font-size:15px;
}

.host-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  margin:18px 0;
  border-radius:13px;
  background:#121212;
  border:1px solid #333;
}

.host-option input{
  width:19px;
  height:19px;
}

#joinBtn{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  background:#fff;
  color:#000;
  font-weight:bold;
  font-size:16px;
}

#loginError{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  color:#ff7777;
  font-size:14px;
}

/* APP */

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

#topbar{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  background:#111;
  border-bottom:1px solid #292929;
  z-index:20;
}

.app-title{
  font-weight:900;
  white-space:nowrap;
}

.room-badge,
.role-badge{
  padding:6px 9px;
  border-radius:999px;
  background:#222;
  color:#ccc;
  font-size:12px;
  white-space:nowrap;
}

.role-badge.host{
  background:#303030;
  color:#fff;
}

.top-spacer{
  flex:1;
}

.top-btn{
  height:38px;
  padding:0 11px;
  border:1px solid #393939;
  border-radius:10px;
  background:#1a1a1a;
  color:#fff;
  font-size:13px;
  white-space:nowrap;
}

.top-btn.active{
  background:#fff;
  color:#000;
}

/* MAIN */

#main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
}

#videoSection{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#000;
}

#videoWrap{
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

#video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

#videoMessage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  padding:30px;
  text-align:center;
  pointer-events:none;
}

#playOverlay{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.35);
}

#playOverlay button{
  width:76px;
  height:76px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:30px;
}

#videoControls{
  height:52px;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:#111;
  border-top:1px solid #222;
}

.control-btn{
  width:38px;
  height:38px;
  border:1px solid #333;
  border-radius:9px;
  background:#1c1c1c;
  color:#fff;
}

#progress{
  flex:1;
  min-width:0;
}

#timeLabel{
  min-width:80px;
  text-align:center;
  direction:ltr;
  color:#aaa;
  font-size:12px;
}

/* CHAT */

#chatSection{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#111;
  border-right:1px solid #292929;
}

#chatHeader{
  height:52px;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #292929;
}

#userCount{
  color:#888;
  font-size:12px;
}

#users{
  max-height:120px;
  overflow-y:auto;
  padding:8px 12px;
  border-bottom:1px solid #292929;
}

.user-item{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  font-size:13px;
}

.user-role{
  color:#888;
  font-size:11px;
}

#messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px;
}

.message{
  margin-bottom:12px;
  word-break:break-word;
}

.message-name{
  margin-bottom:3px;
  color:#888;
  font-size:11px;
}

.message-text{
  display:inline-block;
  max-width:90%;
  padding:9px 11px;
  border-radius:12px;
  background:#222;
  font-size:14px;
  line-height:1.5;
}

#chatForm{
  display:flex;
  gap:7px;
  padding:9px;
  border-top:1px solid #292929;
}

#chatInput{
  flex:1;
  min-width:0;
  height:42px;
  padding:0 11px;
  border:1px solid #393939;
  border-radius:11px;
  outline:none;
  background:#181818;
  color:#fff;
}

#chatSend{
  width:48px;
  height:42px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
}

/* SOURCE */

#sourcePanel{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.75);
}

.source-card{
  width:min(520px,100%);
  max-height:90vh;
  overflow-y:auto;
  padding:20px;
  border-radius:20px;
  background:#161616;
  border:1px solid #333;
}

.source-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.source-title h3{
  margin:0;
}

.close-btn{
  width:36px;
  height:36px;
  border:1px solid #333;
  border-radius:9px;
  background:#222;
  color:#fff;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  height:42px;
  border:1px solid #333;
  border-radius:10px;
  background:#202020;
  color:#aaa;
}

.tab.active{
  background:#fff;
  color:#000;
}

.source-content input[type=text]{
  width:100%;
  height:45px;
  padding:0 11px;
  border:1px solid #3a3a3a;
  border-radius:10px;
  outline:none;
  background:#0f0f0f;
  color:#fff;
}

.file-input{
  width:100%;
  padding:18px;
  border:1px dashed #555;
  border-radius:12px;
  color:#aaa;
  text-align:center;
}

.source-action{
  width:100%;
  height:46px;
  margin-top:12px;
  border:0;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
}

#uploadProgressWrap{
  display:none;
  margin-top:14px;
}

#uploadProgress{
  width:100%;
}

#uploadStatus{
  margin-top:7px;
  color:#999;
  font-size:12px;
  text-align:center;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:300;
  max-width:90%;
  padding:11px 16px;
  border-radius:12px;
  background:#eee;
  color:#000;
  opacity:0;
  pointer-events:none;
  transform:translateX(-50%);
  transition:.2s;
  text-align:center;
}

#toast.show{
  opacity:1;
}

@media(max-width:850px){

  #main{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1fr) 300px;
  }

  #chatSection{
    border-top:1px solid #292929;
    border-right:0;
  }

  .app-title{
    display:none;
  }
}

@media(orientation:landscape) and (max-width:1000px){

  #main{
    grid-template-columns:minmax(0,1fr) 310px;
    grid-template-rows:1fr;
  }

  #chatSection{
    border-top:0;
    border-right:1px solid #292929;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

  <div class="login-card">

    <div class="logo">
      باهم ببینیم
    </div>

    <div class="subtitle">
      با دوستات همزمان فیلم ببین
    </div>

    <div class="field">

      <label>نام شما</label>

      <input
        id="nameInput"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="مثلاً Taha"
      >

    </div>

    <div class="field">

      <label>کد روم</label>

      <input
        id="roomInput"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="مثلاً ABC123"
      >

    </div>

    <label class="host-option">

      <input
        id="hostCheckbox"
        type="checkbox"
      >

      <span>ورود به عنوان Host</span>

    </label>

    <button id="joinBtn">
      ورود به روم
    </button>

    <div id="loginError"></div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header id="topbar">

    <div class="app-title">
      باهم ببینیم
    </div>

    <div
      id="roomBadge"
      class="room-badge"
    >
      ROOM
    </div>

    <div
      id="roleBadge"
      class="role-badge"
    >
      Guest
    </div>

    <div class="top-spacer"></div>

    <button
      id="speakerBtn"
      class="top-btn active"
    >
      🔊 اسپیکر
    </button>

    <button
      id="voiceBtn"
      class="top-btn"
    >
      🎙️ میکروفون
    </button>

    <button
      id="sourceBtn"
      class="top-btn hidden"
    >
      🎬 ویدئو
    </button>

    <button
      id="fullscreenBtn"
      class="top-btn"
    >
      ⛶
    </button>

  </header>


  <main id="main">

    <section id="videoSection">

      <div id="videoWrap">

        <video
          id="video"
          playsinline
          preload="metadata"
        ></video>

        <div id="videoMessage">
          هنوز ویدئویی انتخاب نشده است.
        </div>

        <div
          id="playOverlay"
          class="hidden"
        >

          <button id="manualPlayBtn">
            ▶
          </button>

        </div>

      </div>

      <div id="videoControls">

        <button
          id="playBtn"
          class="control-btn"
        >
          ▶
        </button>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <div id="timeLabel">
          00:00 / 00:00
        </div>

      </div>

    </section>


    <section id="chatSection">

      <div id="chatHeader">

        <strong>چت روم</strong>

        <span id="userCount">
          0/4
        </span>

      </div>

      <div id="users"></div>

      <div id="messages"></div>

      <form id="chatForm">

        <input
          id="chatInput"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="پیام..."
        >

        <button id="chatSend">
          ➤
        </button>

      </form>

    </section>

  </main>

</section>


<!-- SOURCE PANEL -->

<div
  id="sourcePanel"
  class="hidden"
>

  <div class="source-card">

    <div class="source-title">

      <h3>انتخاب ویدئو</h3>

      <button
        id="closeSource"
        class="close-btn"
      >
        ✕
      </button>

    </div>

    <div class="tabs">

      <button
        id="uploadTab"
        class="tab active"
      >
        آپلود فایل
      </button>

      <button
        id="linkTab"
        class="tab"
      >
        لینک ویدئو
      </button>

    </div>

    <div
      id="uploadContent"
      class="source-content"
    >

      <input
        id="videoFile"
        class="file-input"
        type="file"
        accept="video/*,.mkv,.mp4,.webm,.mov,.avi"
      >

      <button
        id="uploadBtn"
        class="source-action"
      >
        آپلود ویدئو
      </button>

      <div id="uploadProgressWrap">

        <progress
          id="uploadProgress"
          value="0"
          max="100"
        ></progress>

        <div id="uploadStatus">
          آماده آپلود
        </div>

      </div>

    </div>

    <div
      id="linkContent"
      class="source-content hidden"
    >

      <input
        id="videoUrl"
        type="text"
        placeholder="https://example.com/video.mp4"
      >

      <button
        id="linkBtn"
        class="source-action"
      >
        پخش این لینک
      </button>

    </div>

  </div>

</div>


<div id="toast"></div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const FIXED_HOST_CODE =
  "tbolandghamat";


/* =========================================================
   SOCKET
========================================================= */

const socket =
  io();


/* =========================================================
   APP STATE
========================================================= */

let roomCode = "";
let myName = "";
let myRole = "guest";

let currentSource = null;
let currentUsers = [];

let hls = null;

let isApplyingRemotePlayback = false;


/* =========================================================
   VOICE STATE
========================================================= */

/*
  اگر false باشد هیچ صدایی از میکروفون
  برای دیگران ارسال نمی‌شود.
*/

let microphoneEnabled = false;


/*
  صدای دیگران را می‌توانیم با اسپیکر
  روشن/خاموش کنیم.
*/

let speakerEnabled = true;


/*
  میکروفون خود کاربر.
*/

let localMicrophoneStream = null;


/*
  اطلاعات Peerها.
*/

const peers = new Map();


/*
  Remote audio elements.
*/

const remoteAudios = new Map();


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const nameInput =
  document.getElementById("nameInput");

const roomInput =
  document.getElementById("roomInput");

const hostCheckbox =
  document.getElementById("hostCheckbox");

const joinBtn =
  document.getElementById("joinBtn");

const loginError =
  document.getElementById("loginError");

const roomBadge =
  document.getElementById("roomBadge");

const roleBadge =
  document.getElementById("roleBadge");

const speakerBtn =
  document.getElementById("speakerBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const sourceBtn =
  document.getElementById("sourceBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const video =
  document.getElementById("video");

const videoMessage =
  document.getElementById("videoMessage");

const playOverlay =
  document.getElementById("playOverlay");

const manualPlayBtn =
  document.getElementById("manualPlayBtn");

const playBtn =
  document.getElementById("playBtn");

const progress =
  document.getElementById("progress");

const timeLabel =
  document.getElementById("timeLabel");

const users =
  document.getElementById("users");

const userCount =
  document.getElementById("userCount");

const messages =
  document.getElementById("messages");

const chatForm =
  document.getElementById("chatForm");

const chatInput =
  document.getElementById("chatInput");

const sourcePanel =
  document.getElementById("sourcePanel");

const closeSource =
  document.getElementById("closeSource");

const uploadTab =
  document.getElementById("uploadTab");

const linkTab =
  document.getElementById("linkTab");

const uploadContent =
  document.getElementById("uploadContent");

const linkContent =
  document.getElementById("linkContent");

const videoFile =
  document.getElementById("videoFile");

const uploadBtn =
  document.getElementById("uploadBtn");

const linkBtn =
  document.getElementById("linkBtn");

const videoUrl =
  document.getElementById("videoUrl");

const uploadProgressWrap =
  document.getElementById("uploadProgressWrap");

const uploadProgress =
  document.getElementById("uploadProgress");

const uploadStatus =
  document.getElementById("uploadStatus");

const toast =
  document.getElementById("toast");


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(text){

  toast.textContent =
    text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => {
        toast.classList.remove("show");
      },
      3000
    );
}


/* =========================================================
   LOGIN
========================================================= */

joinBtn.addEventListener(
  "click",
  joinRoom
);

nameInput.addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      joinRoom();
    }
  }
);

roomInput.addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      joinRoom();
    }
  }
);


function joinRoom(){

  loginError.textContent = "";

  const name =
    nameInput.value.trim();

  const room =
    roomInput.value
      .trim()
      .toUpperCase();

  const wantsHost =
    hostCheckbox.checked;

  if(!name){

    loginError.textContent =
      "نام خود را وارد کنید.";

    return;
  }

  if(!room){

    loginError.textContent =
      "کد روم را وارد کنید.";

    return;
  }

  myName =
    name;

  roomCode =
    room;

  joinBtn.disabled =
    true;

  joinBtn.textContent =
    "در حال ورود...";

  socket.emit(
    "join-room",
    {
      roomCode:room,
      name:name,
      hostCode:
        wantsHost
          ? FIXED_HOST_CODE
          : "",
      wantsHost:wantsHost
    }
  );
}


/* =========================================================
   JOINED
========================================================= */

socket.on(
  "joined-room",
  data => {

    myRole =
      data.role || "guest";

    roomCode =
      data.roomCode || roomCode;

    currentUsers =
      data.users || [];

    loginScreen.classList.add(
      "hidden"
    );

    app.classList.remove(
      "hidden"
    );

    roomBadge.textContent =
      roomCode;

    updateRoleUI();

    renderUsers(
      currentUsers
    );

    if(data.source){

      currentSource =
        data.source;

      loadSource(
        data.source
      );
    }

    if(data.playback){

      applyPlayback(
        data.playback
      );
    }

    joinBtn.disabled =
      false;

    joinBtn.textContent =
      "ورود به روم";

    /*
      WebRTC اتصال را بلافاصله
      آماده نمی‌کنیم.

      بعد از اینکه کاربران را گرفتیم،
      تابع refreshPeers آن را انجام می‌دهد.
    */

    refreshPeers();
  }
);


socket.on(
  "room-error",
  message => {

    loginError.textContent =
      message;

    showToast(
      message
    );

    joinBtn.disabled =
      false;

    joinBtn.textContent =
      "ورود به روم";
  }
);


/* =========================================================
   USERS
========================================================= */

socket.on(
  "room-users",
  data => {

    currentUsers =
      data.users || [];

    renderUsers(
      currentUsers
    );

    refreshPeers();
  }
);


function renderUsers(list){

  users.innerHTML =
    "";

  userCount.textContent =
    `${list.length}/4`;

  list.forEach(
    user => {

      const row =
        document.createElement("div");

      row.className =
        "user-item";

      const name =
        document.createElement("span");

      name.textContent =
        user.name;

      const role =
        document.createElement("span");

      role.className =
        "user-role";

      role.textContent =
        user.role === "host"
          ? "👑 Host"
          : "Guest";

      row.appendChild(name);
      row.appendChild(role);

      users.appendChild(row);
    }
  );
}


/* =========================================================
   ROLE
========================================================= */

function updateRoleUI(){

  if(myRole === "host"){

    roleBadge.textContent =
      "👑 Host";

    roleBadge.classList.add(
      "host"
    );

    sourceBtn.classList.remove(
      "hidden"
    );

  }else{

    roleBadge.textContent =
      "Guest";

    roleBadge.classList.remove(
      "host"
    );

    sourceBtn.classList.add(
      "hidden"
    );
  }
}


socket.on(
  "host-changed",
  data => {

    const hostId =
      data?.hostId || null;

    if(hostId === socket.id){

      myRole =
        "host";

      updateRoleUI();

      showToast(
        "شما Host شدید."
      );

    }else{

      if(myRole === "host"){

        myRole =
          "guest";

        updateRoleUI();
      }

function uploadFile(file){

  uploadBtn.disabled =
    true;

  uploadProgressWrap.style.display =
    "block";

  uploadProgress.value =
    0;

  uploadStatus.textContent =
    "در حال آپلود...";

  const formData =
    new FormData();

  formData.append(
    "video",
    file
  );

  const xhr =
    new XMLHttpRequest();

  xhr.open(
    "POST",
    "/api/upload"
  );

  xhr.upload.addEventListener(
    "progress",
    event => {

      if(event.lengthComputable){

        const percent =
          event.loaded /
          event.total *
          100;

        uploadProgress.value =
          percent;

        uploadStatus.textContent =
          `در حال آپلود: ${Math.round(percent)}٪`;
      }
    }
  );

  xhr.onload =
    () => {

      uploadBtn.disabled =
        false;

      if(xhr.status < 200 || xhr.status >= 300){

        uploadStatus.textContent =
          "آپلود ناموفق بود.";

        showToast(
          "آپلود ناموفق بود."
        );

        return;
      }

      let result;

      try{

        result =
          JSON.parse(
            xhr.responseText
          );

      }catch{

        uploadStatus.textContent =
          "پاسخ سرور نامعتبر است.";

        return;
      }

      if(!result.ok || !result.url){

        uploadStatus.textContent =
          result.error ||
          "آپلود ناموفق بود.";

        return;
      }

      uploadProgress.value =
        100;

      uploadStatus.textContent =
        "آپلود کامل شد.";

      socket.emit(
        "set-source",
        {
          type:"upload",
          url:result.url,
          name:
            result.name ||
            file.name,
          mime:
            result.mime ||
            file.type
        }
      );

      sourcePanel.classList.add(
        "hidden"
      );

      showToast(
        "ویدئو انتخاب شد."
      );
    };

  xhr.onerror =
    () => {

      uploadBtn.disabled =
        false;

      uploadStatus.textContent =
        "خطا در اتصال.";

      showToast(
        "خطا در اتصال به سرور."
      );
    };

  xhr.send(
    formData
  );
}

function destroyHls(){

  if(hls){

    try{
      hls.destroy();
    }catch{}

    hls =
      null;
  }
}


function loadSource(source){

  if(!source?.url){
    return;
  }

  destroyHls();

  video.pause();

  video.removeAttribute(
    "src"
  );

  video.load();

  videoMessage.classList.remove(
    "hidden"
  );

  videoMessage.textContent =
    "در حال بارگذاری ویدئو...";

  const url =
    source.url;

  if(
    url.toLowerCase().includes(".m3u8")
  ){

    if(
      window.Hls &&
      Hls.isSupported()
    ){

      hls =
        new Hls();

      hls.loadSource(
        url
      );

      hls.attachMedia(
        video
      );

      hls.on(
        Hls.Events.MANIFEST_PARSED,
        () => {

          videoMessage.classList.add(
            "hidden"
          );
        }
      );

    }else if(
      video.canPlayType(
        "application/vnd.apple.mpegurl"
      )
    ){

      video.src =
        url;

      videoMessage.classList.add(
        "hidden"
      );

    }else{

      videoMessage.textContent =
        "مرورگر شما از HLS پشتیبانی نمی‌کند.";

      return;
    }

  }else{

    video.src =
      url;

    videoMessage.classList.add(
      "hidden"
    );
  }

  video.load();
}

function applyPlayback(state){

  if(
    !state ||
    !Number.isFinite(
      Number(state.time)
    )
  ){
    return;
  }

  isApplyingRemotePlayback =
    true;

  const target =
    Number(state.time);

  if(
    Math.abs(
      video.currentTime -
      target
    ) > .7
  ){

    video.currentTime =
      target;
  }

  if(state.playing){

    video.play()
      .then(
        () => {
          playOverlay.classList.add(
            "hidden"
          );
        }
      )
      .catch(
        () => {
          playOverlay.classList.remove(
            "hidden"
          );
        }
      );

  }else{

    video.pause();
  }

  setTimeout(
    () => {
      isApplyingRemotePlayback =
        false;
    },
    100
  );
}

);


function formatTime(seconds){

  if(
    !Number.isFinite(seconds)
  ){
    return "00:00";
  }

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const h =
    Math.floor(
      seconds / 3600
    );

  const m =
    Math.floor(
      seconds % 3600 / 60
    );

  const s =
    seconds % 60;

  if(h > 0){

    return (
      String(h).padStart(2,"0") +
      ":" +
      String(m).padStart(2,"0") +
      ":" +
      String(s).padStart(2,"0")
    );
  }

  return (
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );
}

async function toggleMicrophone(){

  if(microphoneEnabled){

  }else{

async function enableMicrophone(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showToast(
      "مرورگر شما از میکروفون پشتیبانی نمی‌کند."
    );

    return;
  }

  try{

    localMicrophoneStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          },
          video:false
        }
      );

    const track =
      localMicrophoneStream
        .getAudioTracks()[0];

    if(!track){
      throw new Error(
        "No microphone track"
      );
    }

    microphoneEnabled =
      true;

    updateMicrophoneUI();


    /*
      برای تمام Peerهای موجود،
      Track میکروفون را اضافه یا جایگزین می‌کنیم.
    */

    for(
      const peer
      of peers.values()
    ){

      await setLocalAudioTrack(
        peer,
        track
      );
    }


    /*
      اعلام وضعیت به سرور.
    */

    socket.emit(
      "voice-state",
      {
        enabled:true
      }
    );

    showToast(
      "میکروفون روشن شد."
    );

  }catch(error){

    console.error(
      "Microphone error:",
      error
    );

    microphoneEnabled =
      false;

    if(localMicrophoneStream){

      localMicrophoneStream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }

    localMicrophoneStream =
      null;

    updateMicrophoneUI();

    showToast(
      "دسترسی به میکروفون داده نشد."
    );
  }
}


async function disableMicrophone(){

  microphoneEnabled =
    false;

  if(localMicrophoneStream){

    localMicrophoneStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localMicrophoneStream =
      null;
  }


  /*
    Track ارسال‌شده را حذف می‌کنیم،
    اما PeerConnection را نمی‌بندیم.
  */

  for(
    const peer
    of peers.values()
  ){

    const sender =
      peer.pc
        .getSenders()
        .find(
          sender =>
            sender.track &&
            sender.track.kind === "audio"
        );

    if(sender){

      try{

        await sender.replaceTrack(
          null
        );

      }catch{}
    }
  }


  updateMicrophoneUI();

  socket.emit(
    "voice-state",
    {
      enabled:false
    }
  );

  showToast(
    "میکروفون خاموش شد."
  );
}


function updateMicrophoneUI(){

  voiceBtn.classList.toggle(

  );

    microphoneEnabled

      : "🎙️ میکروفون";
}


/* =========================================================
   WEBRTC
========================================================= */

/*
  این نسخه از Perfect Negotiation استفاده می‌کند.

  polite:
  اگر دو طرف همزمان بخواهند مذاکره کنند،
  یک طرف Offer را قبول می‌کند و از Collision
  جلوگیری می‌شود.
*/

function isPolite(remoteId){

  return (
    String(socket.id) >
    String(remoteId)
  );
}


function createPeer(remoteId){

  if(peers.has(remoteId)){
    return peers.get(remoteId);
  }

  const peer = {

    pc:null,

    remoteId,

    polite:
      isPolite(remoteId),

    makingOffer:false,

    ignoreOffer:false,

    isSettingRemoteAnswerPending:false
  };


  const pc =
    new RTCPeerConnection(
      {
        iceServers:[
          {
            urls:
              "stun:stun.l.google.com:19302"
          },
          {
            urls:
              "stun:stun1.l.google.com:19302"
          }
        ]
      }
    );


  peer.pc =
    pc;


  peers.set(
    remoteId,
    peer
  );


  /*
    فقط Receive Audio از ابتدا وجود دارد.

    بنابراین کاربری که میکروفون خاموش دارد
    هم می‌تواند صدای دیگران را بشنود.
  */

  const transceiver =
    pc.addTransceiver(
      "audio",
      {
        direction:"recvonly"
      }
    );

  peer.audioTransceiver =
    transceiver;


  /*
    اگر همین کاربر میکروفونش روشن باشد،
    Track را اضافه کن.
  */

  if(
    microphoneEnabled &&
    localMicrophoneStream
  ){

    const track =
      localMicrophoneStream
        .getAudioTracks()[0];

    if(track){

      transceiver.direction =
        "sendrecv";

      transceiver.sender
        .replaceTrack(track)
        .catch(
          error =>
            console.error(
              "Initial track error:",
              error
            )
        );
    }
  }


  /* ICE */

  pc.onicecandidate =
    event => {

      if(
        event.candidate
      ){

        socket.emit(
          "voice-ice",
          {
            target:
              remoteId,

            candidate:
              event.candidate
          }
        );
      }
    };


  /*
    Track دریافتی.

    اینجا هیچ local playback نداریم.
    فقط صدای remote ساخته می‌شود.
  */

  pc.ontrack =
    event => {

      if(
        event.track.kind !==
        "audio"
      ){
        return;
      }

      let audio =
        remoteAudios.get(
          remoteId
        );

      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        audio.setAttribute(
          "playsinline",
          ""
        );

        /*
          مهم:
          این audio صدای شخص مقابل است،
          نه صدای خودمان.
        */

        audio.className =
          "remote-audio";

        audio.style.display =
          "none";

        document.body.appendChild(
          audio
        );

        remoteAudios.set(
          remoteId,
          audio
        );
      }


      if(event.streams?.[0]){

        audio.srcObject =
          event.streams[0];

      }else{

        let stream =
          audio.srcObject;

        if(!stream){

          stream =
            new MediaStream();

          audio.srcObject =
            stream;
        }

        if(
          !stream
            .getAudioTracks()
            .includes(event.track)
        ){

          stream.addTrack(
            event.track
          );
        }
      }


      audio.muted =
        !speakerEnabled;

      audio.volume =
        speakerEnabled
          ? 1
          : 0;


      /*
        تلاش برای شروع پخش.
      */

      audio.play()
        .catch(
          () => {
            /*
              روی بعضی موبایل‌ها autoplay
              صدای WebRTC تا اولین تعامل
              کاربر مسدود می‌شود.
            */
          }
        );
    };


  /*
    Perfect Negotiation
  */

  pc.onnegotiationneeded =
    async () => {

      try{

        peer.makingOffer =
          true;

        await pc.setLocalDescription();

        socket.emit(
          "voice-offer",
          {
            target:
              remoteId,

            offer:
              pc.localDescription
          }
        );

      }catch(error){

        console.error(
          "Negotiation error:",
          error
        );

      }finally{

        peer.makingOffer =
          false;
      }
    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "Voice connection",
        remoteId,
        pc.connectionState
      );


      if(
        pc.connectionState ===
          "failed"
      ){

        /*
          یک بار ICE restart.
        */

        try{

          pc.restartIce();

        }catch{}
      }


      if(
        pc.connectionState ===
          "closed"
      ){

        removePeer(
          remoteId
        );
      }
    };


  return peer;
}


/* =========================================================
   REFRESH PEERS
========================================================= */

async function refreshPeers(){

  const activeIds =
    new Set(
      currentUsers
        .map(
          user => user.id
        )
        .filter(
          id =>
            id &&
            id !== socket.id
        )
    );


  /*
    Peerهای افراد خارج‌شده را ببند.
  */

  for(
    const [
      remoteId,
      peer
    ]
    of peers
  ){

    if(
      !activeIds.has(
        remoteId
      )
    ){

      try{
        peer.pc.close();
      }catch{}

      removePeer(
        remoteId
      );
    }
  }


  /*
    برای هر فرد جدید Peer بساز.
  */

  for(
    const remoteId
    of activeIds
  ){

    if(
      peers.has(
        remoteId
      )
    ){
      continue;
    }

    createPeer(
      remoteId
    );
  }
}


/* =========================================================
   SET LOCAL AUDIO TRACK
========================================================= */

async function setLocalAudioTrack(
  peer,
  track
){

  if(!peer || !peer.pc){
    return;
  }

  const pc =
    peer.pc;


  /*
    اول ببین آیا Sender صوتی داریم.
  */

  let sender =
    pc.getSenders()
      .find(
        s =>
          s.track?.kind ===
          "audio"
      );


  /*
    اگر Sender نداریم،
    Transceiver صوتی را پیدا کن.
  */

  if(!sender){

    const transceiver =
      pc.getTransceivers()
        .find(
          t =>
            t.receiver
              ?.track
              ?.kind ===
              "audio"
        );

    if(transceiver){

      peer.audioTransceiver =
        transceiver;

      sender =
        transceiver.sender;
    }
  }


  /*
    اگر هنوز Sender نداریم،
    یک Track جدید اضافه کن.
  */

  if(!sender){

    sender =
      pc.addTrack(
        track,
        new MediaStream([
          track
        ])
      );

  }else{

    await sender.replaceTrack(
      track
    );
  }


  /*
    Direction باید sendrecv باشد.
  */

  if(
    peer.audioTransceiver
  ){

    peer.audioTransceiver.direction =
      "sendrecv";
  }
}


/* =========================================================
   VOICE OFFER
========================================================= */

socket.on(
  "voice-offer",
  async data => {

    if(
      !data?.from ||
      !data?.offer
    ){
      return;
    }

    const remoteId =
      data.from;

    const peer =
      createPeer(
        remoteId
      );

    const pc =
      peer.pc;


    /*
      Perfect Negotiation:
      اگر Offer Collision اتفاق افتاد،
      طرف polite آن را قبول می‌کند.
    */

    const offerCollision =
      peer.makingOffer ||
      pc.signalingState !==
        "stable";


    peer.ignoreOffer =
      !peer.polite &&
      offerCollision;


    if(peer.ignoreOffer){

      console.log(
        "Ignoring offer collision from",
        remoteId
      );

      return;
    }


    try{

      if(
        offerCollision &&
        peer.polite
      ){

        await pc.setLocalDescription(
          {
            type:"rollback"
          }
        );
      }


      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );


      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );


      socket.emit(
        "voice-answer",
        {
          target:
            remoteId,

          answer:
            pc.localDescription
        }
      );

    }catch(error){

      console.error(
        "Offer handling error:",
        error
      );
    }
  }
);


/* =========================================================
   VOICE ANSWER
========================================================= */

socket.on(
  "voice-answer",
  async data => {

    if(
      !data?.from ||
      !data?.answer
    ){
      return;
    }

    const peer =
      peers.get(
        data.from
      );

    if(!peer){
      return;
    }

    try{

      await peer.pc.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

    }catch(error){

      console.error(
        "Answer error:",
        error
      );
    }
  }
);


/* =========================================================
   ICE
========================================================= */

socket.on(
  "voice-ice",
  async data => {

    if(
      !data?.from ||
      !data?.candidate
    ){
      return;
    }

    const peer =
      peers.get(
        data.from
      );

    if(!peer){
      return;
    }

    try{

      if(
        peer.ignoreOffer
      ){
        return;
      }

      await peer.pc.addIceCandidate(
        new RTCIceCandidate(
          data.candidate
        )
      );

    }catch(error){

      console.error(
        "ICE error:",
        error
      );
    }
  }
);


/* =========================================================
   VOICE STATE
========================================================= */

socket.on(
  "voice-state",
  data => {

    /*
      این event فقط برای نمایش وضعیت است.
      پخش صدا وابسته به روشن بودن میکروفون
      طرف مقابل نیست.
    */

    console.log(
      "Remote microphone:",
      data?.id,
      data?.enabled
    );
  }
);


/* =========================================================
   REMOVE PEER
========================================================= */

function removePeer(
  remoteId
){

  const peer =
    peers.get(
      remoteId
    );

  if(peer){

    try{
      peer.pc.close();
    }catch{}

    peers.delete(
      remoteId
    );
  }


  const audio =
    remoteAudios.get(
      remoteId
    );

  if(audio){

    try{
      audio.pause();
    }catch{}

    try{
      audio.srcObject =
        null;
    }catch{}

    try{
      audio.remove();
    }catch{}

    remoteAudios.delete(
      remoteId
    );
  }
}


/* =========================================================
   DISCONNECT
========================================================= */

socket.on(
  "disconnect",
  () => {

    for(
      const [
        remoteId
      ]
      of peers
    ){

      removePeer(
        remoteId
      );
    }

    if(localMicrophoneStream){

      localMicrophoneStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      localMicrophoneStream =
        null;
    }

    microphoneEnabled =
      false;

    updateMicrophoneUI();
  }
);


/* =========================================================
   MOBILE AUDIO UNLOCK
========================================================= */

function unlockRemoteAudio(){

  if(!speakerEnabled){
    return;
  }

  remoteAudios.forEach(
    audio => {

      audio.muted =
        false;

      audio.volume =
        1;

      if(audio.srcObject){

        audio.play()
          .catch(
            () => {}
          );
      }
    }
  );
}


document.addEventListener(
  "click",
  unlockRemoteAudio,
  {
    passive:true
  }
);

document.addEventListener(
  "touchstart",
  unlockRemoteAudio,
  {
    passive:true
  }
);


/* =========================================================
   INITIAL UI
========================================================= */

updateSpeakerUI();

updateMicrophoneUI();

</script>
