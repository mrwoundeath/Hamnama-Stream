<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>باهم ببینیم</title>

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2314141a'/%3E%3Cpath d='M28 25h44a8 8 0 0 1 8 8v34a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8V33a8 8 0 0 1 8-8Z' fill='%236c63ff'/%3E%3Cpath d='m43 39 22 11-22 11V39Z' fill='white'/%3E%3C/svg%3E"
  />

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0f;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .screen {
      width: 100%;
      height: 100%;
      display: none;
    }

    .screen.active {
      display: flex;
    }

    /* INTRO */

    #intro {
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background:
        radial-gradient(circle at center, #20202b 0%, #0b0b0f 60%);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 26px;
      background: #6c63ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 15px 50px rgba(108, 99, 255, 0.35);
      animation: logoIn 0.7s ease;
    }

    .intro-title {
      margin-top: 22px;
      font-size: 27px;
      font-weight: 800;
    }

    .intro-subtitle {
      margin-top: 8px;
      color: #9999a5;
      font-size: 14px;
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* LOGIN */

    #login {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(430px, 100%);
      background: #15151c;
      border: 1px solid #292932;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .login-card p {
      color: #9999a5;
      margin: 0 0 25px;
      line-height: 1.7;
      font-size: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #bdbdc7;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid #30303a;
      outline: none;
      background: #0e0e13;
      color: white;
      padding: 0 15px;
    }

    .field input:focus {
      border-color: #6c63ff;
    }

    .primary {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      background: #6c63ff;
      color: white;
      font-weight: 700;
      margin-top: 8px;
    }

    .primary:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff7373;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* ROOM */

    #room {
      flex-direction: column;
      background: #09090c;
    }

    .topbar {
      height: 62px;
      min-height: 62px;
      background: #121218;
      border-bottom: 1px solid #272730;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .mini-logo {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #6c63ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 14px;
    }

    .room-info {
      color: #888894;
      font-size: 11px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-badge {
      padding: 7px 10px;
      border-radius: 10px;
      background: #22222c;
      color: #bcb9ff;
      font-size: 11px;
      white-space: nowrap;
    }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: hidden;
    }

    .video-section {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #050507;
      position: relative;
    }

    .video-stage {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 25px;
      text-align: center;
      background:
        radial-gradient(circle at center, #17171e 0%, #050507 65%);
    }

    .empty-icon {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: #1d1d26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 17px;
    }

    .empty-title {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-text {
      color: #858590;
      font-size: 13px;
      max-width: 390px;
      line-height: 1.8;
    }

    .source-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(470px, calc(100% - 30px));
      max-height: calc(100% - 30px);
      overflow-y: auto;
      background: rgba(18, 18, 24, 0.97);
      border: 1px solid #30303a;
      border-radius: 20px;
      padding: 20px;
      z-index: 5;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.55);
    }

    .source-panel h2 {
      margin: 0 0 6px;
      font-size: 19px;
    }

    .source-panel p {
      margin: 0 0 18px;
      color: #888894;
      font-size: 12px;
      line-height: 1.7;
    }

    .source-tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 13px;
    }

    .source-tab {
      flex: 1;
      padding: 10px 7px;
      border-radius: 11px;
      background: #22222b;
      color: #aaaab5;
      font-size: 12px;
    }

    .source-tab.active {
      background: #6c63ff;
      color: white;
    }

    .source-input {
      width: 100%;
      height: 47px;
      border-radius: 12px;
      border: 1px solid #30303a;
      background: #0c0c11;
      color: white;
      padding: 0 12px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    .source-input:focus {
      border-color: #6c63ff;
    }

    .file-label {
      width: 100%;
      min-height: 47px;
      border-radius: 12px;
      background: #0c0c11;
      border: 1px dashed #444450;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaaab5;
      cursor: pointer;
      font-size: 13px;
      padding: 10px;
      text-align: center;
    }

    .file-label input {
      display: none;
    }

    .source-submit {
      width: 100%;
      height: 47px;
      border-radius: 12px;
      background: #6c63ff;
      color: white;
      font-weight: 700;
      margin-top: 12px;
    }

    .source-status {
      color: #8f8f9b;
      font-size: 11px;
      margin-top: 9px;
      text-align: center;
      min-height: 16px;
    }

    .controls {
      background: #101015;
      border-top: 1px solid #23232b;
      padding: 8px 11px 10px;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      direction: ltr;
    }

    .time {
      color: #9999a5;
      font-size: 10px;
      width: 38px;
      text-align: center;
    }

    .progress {
      flex: 1;
      accent-color: #6c63ff;
      height: 4px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 7px;
    }

    .control-button {
      width: 39px;
      height: 34px;
      border-radius: 10px;
      background: #202027;
      color: #ddd;
      font-size: 14px;
    }

    .control-button.play {
      width: 45px;
      background: #6c63ff;
      color: white;
    }

    .control-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* CHAT */

    .chat {
      width: 340px;
      min-width: 280px;
      background: #111116;
      border-right: 1px solid #25252d;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 53px;
      min-height: 53px;
      border-bottom: 1px solid #282831;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .chat-title {
      font-weight: 700;
      font-size: 14px;
    }

    .people {
      color: #7e7e89;
      font-size: 11px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 13px;
    }

    .message {
      margin-bottom: 12px;
    }

    .message-name {
      font-size: 11px;
      color: #8e88ff;
      margin-bottom: 4px;
    }

    .message-bubble {
      display: inline-block;
      max-width: 90%;
      background: #202027;
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 12px;
      line-height: 1.7;
      word-break: break-word;
    }

    .message.self .message-bubble {
      background: #4f49b8;
    }

    .chat-form {
      padding: 10px;
      border-top: 1px solid #282831;
      display: flex;
      gap: 7px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 43px;
      border: 1px solid #30303a;
      border-radius: 12px;
      background: #0b0b0f;
      color: white;
      padding: 0 11px;
      outline: none;
    }

    .chat-send {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      background: #6c63ff;
      color: white;
    }

    .waiting {
      color: #888894;
      font-size: 12px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* MOBILE */

    @media (max-width: 750px) {
      .content {
        flex-direction: column;
      }

      .video-section {
        min-height: 55%;
      }

      .chat {
        width: 100%;
        min-width: 0;
        height: 45%;
        border-right: 0;
        border-top: 1px solid #25252d;
      }

      .chat-header {
        height: 43px;
        min-height: 43px;
      }

      .messages {
        padding: 9px;
      }

      .chat-form {
        padding: 7px;
      }

      .control-button {
        width: 37px;
      }
    }

    /* LANDSCAPE */

    @media (orientation: landscape) and (max-height: 600px) {
      .content {
        flex-direction: row;
      }

      .video-section {
        width: 68%;
        min-height: 0;
      }

      .chat {
        width: 32%;
        min-width: 230px;
        height: auto;
        border-right: 1px solid #25252d;
        border-top: 0;
      }

      .chat-header {
        height: 45px;
        min-height: 45px;
      }

      .messages {
        padding: 8px;
      }

      .chat-form {
        padding: 7px;
      }

      .controls {
        padding: 5px 8px 6px;
      }

      .control-buttons {
        margin-top: 4px;
      }

      .control-button {
        height: 29px;
        width: 34px;
      }

      .control-button.play {
        width: 39px;
      }
    }
  </style>
</head>

<body>

  <!-- INTRO -->
  <section id="intro" class="screen active">
    <div class="logo">▶</div>
    <div class="intro-title">باهم ببینیم</div>
    <div class="intro-subtitle">همزمان فیلم ببینید و چت کنید</div>
  </section>


  <!-- LOGIN -->
  <section id="login" class="screen">

    <div class="login-card">

      <h1>ورود به روم</h1>

      <p>
        اسمت و کد روم رو وارد کن تا وارد تماشای مشترک بشی.
      </p>

      <div class="field">
        <label>نام</label>
        <input
          id="nameInput"
          type="text"
          maxlength="30"
          placeholder="مثلاً Taha"
          autocomplete="off"
        />
      </div>

      <div class="field">
        <label>کد روم</label>
        <input
          id="roomInput"
          type="text"
          maxlength="30"
          placeholder="مثلاً ABC123"
          autocomplete="off"
          dir="ltr"
        />
      </div>

      <button
        id="joinButton"
        class="primary"
      >
        ورود به روم
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </div>

  </section>


  <!-- ROOM -->
  <section id="room" class="screen">

    <header class="topbar">

      <div class="brand">

        <div class="mini-logo">
          ▶
        </div>

        <div class="brand-text">

          <div class="brand-title">
            باهم ببینیم
          </div>

          <div
            id="roomInfo"
            class="room-info"
          ></div>

        </div>

      </div>

      <div
        id="roleBadge"
        class="role-badge"
      >
        مهمان
      </div>

    </header>


    <main class="content">

      <!-- VIDEO -->

      <section class="video-section">

        <div
          id="videoStage"
          class="video-stage"
        >

          <div
            id="emptyState"
            class="empty-state"
          >

            <div class="empty-icon">
              🎬
            </div>

            <div
              id="emptyTitle"
              class="empty-title"
            >
              منتظر ویدئو
            </div>

            <div
              id="emptyText"
              class="empty-text"
            >
              میزبان هنوز ویدئویی انتخاب نکرده است.
            </div>

          </div>


          <video
            id="video"
            playsinline
            preload="metadata"
          ></video>


          <!-- SOURCE PANEL -->

          <div
            id="sourcePanel"
            class="source-panel hidden"
          >

            <h2>
              انتخاب ویدئو
            </h2>

            <p>
              فقط میزبان می‌تواند منبع پخش را انتخاب کند.
            </p>


            <div class="source-tabs">

              <button
                id="uploadTab"
                class="source-tab active"
              >
                فایل ویدئویی
              </button>

              <button
                id="urlTab"
                class="source-tab"
              >
                لینک ویدئو
              </button>

            </div>


            <div id="uploadSource">

              <label class="file-label">

                <input
                  id="fileInput"
                  type="file"
                  accept="video/*"
                />

                انتخاب فایل ویدئویی

              </label>

            </div>


            <div
              id="urlSource"
              class="hidden"
            >

              <input
                id="urlInput"
                class="source-input"
                type="url"
                placeholder="https://example.com/video.mp4"
                dir="ltr"
              />

            </div>


            <button
              id="sourceSubmit"
              class="source-submit"
            >
              شروع پخش
            </button>

            <div
              id="sourceStatus"
              class="source-status"
            ></div>

          </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

          <div class="progress-row">

            <span
              id="currentTime"
              class="time"
            >
              00:00
            </span>

            <input
              id="progress"
              class="progress"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
            />

            <span
              id="duration"
              class="time"
            >
              00:00
            </span>

          </div>


          <div class="control-buttons">

            <button
              id="back10"
              class="control-button"
              title="10 ثانیه عقب"
            >
              ↶10
            </button>

            <button
              id="playButton"
              class="control-button play"
              title="پخش"
            >
              ▶
            </button>

            <button
              id="forward10"
              class="control-button"
              title="10 ثانیه جلو"
            >
              10↷
            </button>

            <button
              id="fullscreenButton"
              class="control-button"
              title="تمام صفحه"
            >
              ⛶
            </button>

          </div>

        </div>

      </section>


      <!-- CHAT -->

      <aside class="chat">

        <div class="chat-header">

          <div class="chat-title">
            چت
          </div>

          <div
            id="people"
            class="people"
          >
            0 نفر
          </div>

        </div>


        <div
          id="messages"
          class="messages"
        ></div>


        <form
          id="chatForm"
          class="chat-form"
        >

          <input
            id="chatInput"
            class="chat-input"
            maxlength="500"
            placeholder="پیامت رو بنویس..."
            autocomplete="off"
          />

          <button
            class="chat-send"
            type="submit"
          >
            ➤
          </button>

        </form>

      </aside>

    </main>

  </section>


  <script>

    const socket = io();


    const intro =
      document.getElementById("intro");

    const login =
      document.getElementById("login");

    const room =
      document.getElementById("room");

    const nameInput =
      document.getElementById("nameInput");

    const roomInput =
      document.getElementById("roomInput");

    const joinButton =
      document.getElementById("joinButton");

    const loginError =
      document.getElementById("loginError");

    const roomInfo =
      document.getElementById("roomInfo");

    const roleBadge =
      document.getElementById("roleBadge");

    const videoStage =
      document.getElementById("videoStage");

    const video =
      document.getElementById("video");

    const emptyState =
      document.getElementById("emptyState");

    const emptyTitle =
      document.getElementById("emptyTitle");

    const emptyText =
      document.getElementById("emptyText");

    const sourcePanel =
      document.getElementById("sourcePanel");

    const uploadTab =
      document.getElementById("uploadTab");

    const urlTab =
      document.getElementById("urlTab");

    const uploadSource =
      document.getElementById("uploadSource");

    const urlSource =
      document.getElementById("urlSource");

    const fileInput =
      document.getElementById("fileInput");

    const urlInput =
      document.getElementById("urlInput");

    const sourceSubmit =
      document.getElementById("sourceSubmit");

    const sourceStatus =
      document.getElementById("sourceStatus");

    const playButton =
      document.getElementById("playButton");

    const back10 =
      document.getElementById("back10");

    const forward10 =
      document.getElementById("forward10");

    const fullscreenButton =
      docume
