<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>باهم ببینیم - Stream</title>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #252525, #080808 60%);
    }

    .login-card {
      width: min(440px, 100%);
      padding: 30px;
      border-radius: 24px;
      background: #181818;
      border: 1px solid #333;
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }

    .logo {
      text-align: center;
      font-size: 31px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border-radius: 13px;
      border: 1px solid #444;
      outline: none;
      background: #0e0e0e;
      color: #fff;
      font-size: 15px;
    }

    .host-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      margin: 18px 0;
      border-radius: 13px;
      background: #121212;
      border: 1px solid #333;
    }

    .host-option input {
      width: 19px;
      height: 19px;
    }

    #joinBtn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 16px;
    }

    #loginError {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      color: #ff7777;
      font-size: 14px;
    }

    /* APP */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      background: #111;
      border-bottom: 1px solid #292929;
      z-index: 20;
    }

    .app-title {
      font-weight: 900;
      white-space: nowrap;
    }

    .room-badge,
    .role-badge {
      padding: 6px 9px;
      border-radius: 999px;
      background: #222;
      color: #ccc;
      font-size: 12px;
      white-space: nowrap;
    }

    .role-badge.host {
      background: #303030;
      color: #fff;
    }

    .top-spacer {
      flex: 1;
    }

    .top-btn {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #393939;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
    }

    /* MAIN */

    #main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) 340px;
    }

    #videoSection {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #videoWrap {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #videoMessage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      padding: 30px;
      text-align: center;
      pointer-events: none;
    }

    #playOverlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,.35);
    }

    #playOverlay button {
      width: 76px;
      height: 76px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 30px;
    }

    #videoControls {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: #111;
      border-top: 1px solid #222;
    }

    .control-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #1c1c1c;
      color: #fff;
    }

    #progress {
      flex: 1;
      min-width: 0;
    }

    #timeLabel {
      min-width: 80px;
      text-align: center;
      direction: ltr;
      color: #aaa;
      font-size: 12px;
    }

    /* CHAT */

    #chatSection {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #111;
      border-right: 1px solid #292929;
    }

    #chatHeader {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #292929;
    }

    #userCount {
      color: #888;
      font-size: 12px;
    }

    #users {
      max-height: 120px;
      overflow-y: auto;
      padding: 8px 12px;
      border-bottom: 1px solid #292929;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 13px;
    }

    .user-role {
      color: #888;
      font-size: 11px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
    }

    .message {
      margin-bottom: 12px;
      word-break: break-word;
    }

    .message-name {
      margin-bottom: 3px;
      color: #888;
      font-size: 11px;
    }

    .message-text {
      display: inline-block;
      max-width: 90%;
      padding: 9px 11px;
      border-radius: 12px;
      background: #222;
      font-size: 14px;
      line-height: 1.5;
    }

    #chatForm {
      display: flex;
      gap: 7px;
      padding: 9px;
      border-top: 1px solid #292929;
    }

    #chatInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 11px;
      border: 1px solid #393939;
      border-radius: 11px;
      outline: none;
      background: #181818;
      color: #fff;
    }

    #chatSend {
      width: 48px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    /* SOURCE */

    #sourcePanel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0,0,0,.75);
    }

    .source-card {
      width: min(520px,100%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 20px;
      background: #161616;
      border: 1px solid #333;
    }

    .source-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .source-title h3 {
      margin: 0;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #222;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      height: 42px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #202020;
      color: #aaa;
    }

    .tab.active {
      background: #fff;
      color: #000;
    }

    .source-content input[type=text] {
      width: 100%;
      height: 45px;
      padding: 0 11px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      outline: none;
      background: #0f0f0f;
      color: #fff;
    }

    .file-input {
      width: 100%;
      padding: 18px;
      border: 1px dashed #555;
      border-radius: 12px;
      color: #aaa;
      text-align: center;
    }

    .source-action {
      width: 100%;
      height: 46px;
      margin-top: 12px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    #uploadProgressWrap {
      display: none;
      margin-top: 14px;
    }

    #uploadProgress {
      width: 100%;
    }

    #uploadStatus {
      margin-top: 7px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }

    /* TOAST */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 300;
      max-width: 90%;
      padding: 11px 16px;
      border-radius: 12px;
      background: #eee;
      color: #000;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: .2s;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
    }

    /* RESPONSIVE */

    @media(max-width:850px) {
      #main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0,1fr) 300px;
      }

      #chatSection {
        border-top: 1px solid #292929;
        border-right: 0;
      }

      .app-title {
        display: none;
      }
    }

    @media(orientation:landscape) and (max-width:1000px) {
      #main {
        grid-template-columns: minmax(0,1fr) 310px;
        grid-template-rows: 1fr;
      }

      #chatSection {
        border-top: 0;
        border-right: 1px solid #292929;
      }
    }

    #videoSection:fullscreen {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

  <div class="login-card">

    <div class="logo">
      باهم ببینیم
    </div>

    <div class="subtitle">
      با دوستات همزمان فیلم ببین
    </div>

    <div class="field">
      <label>نام شما</label>

      <input
        id="nameInput"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="مثلاً Taha"
      >
    </div>

    <div class="field">
      <label>کد روم</label>

      <input
        id="roomInput"
        type="text"
        maxlength="30"
        autocomplete="off"
        placeholder="مثلاً ABC123"
      >
    </div>

    <label class="host-option">

      <input
        id="hostCheckbox"
        type="checkbox"
      >

      <span>
        ورود به عنوان Host
      </span>

    </label>

    <button id="joinBtn">
      ورود به روم
    </button>

    <div id="loginError"></div>

  </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

  <header id="topbar">

    <div class="app-title">
      باهم ببینیم
    </div>

    <div
      id="roomBadge"
      class="room-badge"
    >
      ROOM
    </div>

    <div
      id="roleBadge"
      class="role-badge"
    >
      Guest
    </div>

    <div class="top-spacer"></div>

    <button
      id="voiceBtn"
      class="top-btn"
    >
      🎙️ صدا
    </button>

    <button
      id="sourceBtn"
      class="top-btn hidden"
    >
      🎬 ویدئو
    </button>

    <button
      id="fullscreenBtn"
      class="top-btn"
    >
      ⛶
    </button>

  </header>


  <main id="main">

    <section id="videoSection">

      <div id="videoWrap">

        <video
          id="video"
          playsinline
          preload="metadata"
        ></video>

        <div id="videoMessage">
          هنوز ویدئویی انتخاب نشده است.
        </div>

        <div
          id="playOverlay"
          class="hidden"
        >
          <button id="manualPlayBtn">
            ▶
          </button>
        </div>

      </div>

      <div id="videoControls">

        <button
          id="playBtn"
          class="control-btn"
        >
          ▶
        </button>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <div id="timeLabel">
          00:00 / 00:00
        </div>

      </div>

    </section>


    <section id="chatSection">

      <div id="chatHeader">

        <strong>
          چت روم
        </strong>

        <span id="userCount">
          0/4
        </span>

      </div>

      <div id="users"></div>

      <div id="messages"></div>

      <form id="chatForm">

        <input
          id="chatInput"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="پیام..."
        >

        <button id="chatSend">
          ➤
        </button>

      </form>

    </section>

  </main>

</section>


<!-- SOURCE PANEL -->

<div
  id="sourcePanel"
  class="hidden"
>

  <div class="source-card">

    <div class="source-title">

      <h3>
        انتخاب ویدئو
      </h3>

      <button
        id="closeSource"
        class="close-btn"
      >
        ✕
      </button>

    </div>

    <div class="tabs">

      <button
        id="uploadTab"
        class="tab active"
      >
        آپلود فایل
      </button>

      <button
        id="linkTab"
        class="tab"
      >
        لینک ویدئو
      </button>

    </div>

    <div
      id="uploadContent"
      class="source-content"
    >

      <input
        id="videoFile"
        class="file-input"
        type="file"
        accept="video/*,.mkv,.mp4,.webm,.mov,.avi"
      >

      <button
        id="uploadBtn"
        class="source-action"
      >
        آپلود ویدئو
      </button>

      <div id="uploadProgressWrap">

        <progress
          id="uploadProgress"
          value="0"
          max="100"
        ></progress>

        <div id="uploadStatus">
          آماده آپلود
        </div>

      </div>

    </div>

    <div
      id="linkContent"
      class="source-content hidden"
    >

      <input
        id="videoUrl"
        type="text"
        placeholder="https://example.com/video.mp4"
      >

      <button
        id="linkBtn"
        class="source-action"
      >
        پخش این لینک
      </button>

    </div>

  </div>

</div>


<div id="toast"></div>


<script>

  /* ======================================================
     CONSTANTS
  ====================================================== */

  const FIXED_HOST_CODE =
    "tbolandghamat";


  /* ======================================================
     SOCKET
  ====================================================== */

  const socket =
    io();


  /* ======================================================
     STATE
  ====================================================== */

  let roomCode = "";
  let myName = "";
  let myRole = "guest";

  let currentSource = null;
  let hls = null;

  let isApplyingRemotePlayback = false;

  let currentUsers = [];

  /*
    Voice state
  */

  let voiceEnabled = false;

  let localStream = null;

  /*
    peerConnections:
    Map<socketId, RTCPeerConnection>
  */

  const peerConnections =
    new Map();

  /*
    Pending ICE candidates are stored here
    until remote description is available.
  */

  const pendingIce =
    new Map();

  /*
    Used to prevent multiple simultaneous
    connection attempts.
  */

  const creatingPeers =
    new Map();


  /* ======================================================
     ELEMENTS
  ====================================================== */

  const loginScreen =
    document.getElementById(
      "loginScreen"
    );

  const app =
    document.getElementById(
      "app"
    );

  const nameInput =
    document.getElementById(
      "nameInput"
    );

  const roomInput =
    document.getElementById(
      "roomInput"
    );

  const hostCheckbox =
    document.getElementById(
      "hostCheckbox"
    );

  const joinBtn =
    document.getElementById(
      "joinBtn"
    );

  const loginError =
    document.getElementById(
      "loginError"
    );

  const roomBadge =
    document.getElementById(
      "roomBadge"
    );

  const roleBadge =
    document.getElementById(
      "roleBadge"
    );

  const sourceBtn =
    document.getElementById(
      "sourceBtn"
    );

  const voiceBtn =
    document.getElementById(
      "voiceBtn"
    );

  const fullscreenBtn =
    document.getElementById(
      "fullscreenBtn"
    );

  const videoSection =
    document.getElementById(
      "videoSection"
    );

  const video =
    document.getElementById(
      "video"
    );

  const videoMessage =
    document.getElementById(
      "videoMessage"
    );

  const playOverlay =
    document.getElementById(
      "playOverlay"
    );

  const manualPlayBtn =
    document.getElementById(
      "manualPlayBtn"
    );

  const playBtn =
    document.getElementById(
      "playBtn"
    );

  const progress =
    document.getElementById(
      "progress"
    );

  const timeLabel =
    document.getElementById(
      "timeLabel"
    );

  const users =
    document.getElementById(
      "users"
    );

  const userCount =
    document.getElementById(
      "userCount"
    );

  const messages =
    document.getElementById(
      "messages"
    );

  const chatForm =
    document.getElementById(
      "chatForm"
    );

  const chatInput =
    document.getElementById(
      "chatInput"
    );

  const sourcePanel =
    document.getElementById(
      "sourcePanel"
    );

  const closeSource =
    document.getElementById(
      "closeSource"
    );

  const uploadTab =
    document.getElementById(
      "uploadTab"
    );

  const linkTab =
    document.getElementById(
      "linkTab"
    );

  const uploadContent =
    document.getElementById(
      "uploadContent"
    );

  const linkContent =
    document.getElementById(
      "linkContent"
    );

  const videoFile =
    document.getElementById(
      "videoFile"
    );

  const uploadBtn =
    document.getElementById(
      "uploadBtn"
    );

  const linkBtn =
    document.getElementById(
      "linkBtn"
    );

  const videoUrl =
    document.getElementById(
      "videoUrl"
    );

  const uploadProgressWrap =
    document.getElementById(
      "uploadProgressWrap"
    );

  const uploadProgress =
    document.getElementById(
      "uploadProgress"
    );

  const uploadStatus =
    document.getElementById(
      "uploadStatus"
    );

  const toast =
    document.getElementById(
      "toast"
    );


  /* ======================================================
     TOAST
  ====================================================== */

  let toastTimer = null;

  function showToast(text) {

    toast.textContent =
      text;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        3000
      );
  }


  /* ======================================================
     LOGIN
  ====================================================== */

  joinBtn.addEventListener(
    "click",
    joinRoom
  );

  nameInput.addEventListener(
    "keydown",
    e => {
      if (e.key === "Enter") {
        joinRoom();
      }
    }
  );

  roomInput.addEventListener(
    "keydown",
    e => {
      if (e.key === "Enter") {
        joinRoom();
      }
    }
  );


  function joinRoom() {

    loginError.textContent =
      "";

    const name =
      nameInput.value.trim();

    const room =
      roomInput.value
        .trim()
        .toUpperCase();

    const wantsHost =
      hostCheckbox.checked;

    if (!name) {
      loginError.textContent =
        "نام خود را وارد کنید.";
      return;
    }

    if (!room) {
      loginError.textContent =
        "کد روم را وارد کنید.";
      return;
    }

    myName =
      name;

    roomCode =
      room;

    joinBtn.disabled =
      true;

    joinBtn.textContent =
      "در حال ورود...";

    socket.emit(
      "join-room",
      {
        roomCode:
          room,

        name:
          name,

        hostCode:
          wantsHost
            ? FIXED_HOST_CODE
            : "",

        wantsHost:
          wantsHost
      }
    );
  }


  /* ======================================================
     JOINED
  ====================================================== */

  socket.on(
    "joined-room",
    data => {

      myRole =
        data.role || "guest";

      roomCode =
        data.roomCode || roomCode;

      currentUsers =
        data.users || [];

      loginScreen.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );

      roomBadge.textContent =
        roomCode;

      updateRoleUI();

      renderUsers(
        currentUsers
      );

      if (data.source) {

        currentSource =
          data.source;

        loadSource(
          data.source
        );
      }

      if (data.playback) {

        applyPlayback(
          data.playback
        );
      }

      updateVoiceButton();

      joinBtn.disabled =
        false;

      joinBtn.textContent =
        "ورود به روم";
    }
  );


  socket.on(
    "room-error",
    message => {

      loginError.textContent =
        message;

      showToast(
        message
      );

      joinBtn.disabled =
        false;

      joinBtn.textContent =
        "ورود به روم";
    }
  );


  /* ======================================================
     ROLE
  ====================================================== */

  function updateRoleUI() {

    if (myRole === "host") {

      roleBadge.textContent =
        "👑 Host";

      roleBadge.classList.add(
        "host"
      );

      sourceBtn.classList.remove(
        "hidden"
      );

    } else {

      roleBadge.textContent =
        "Guest";

      roleBadge.classList.remove(
        "host"
      );

      sourceBtn.classList.add(
        "hidden"
      );
    }
  }


  /* ======================================================

  async function validateSource(source) {

    if (
      source.url
        .toLowerCase()
        .includes(".m3u8")
    ) {
      return true;
    }

    return new Promise(
      (resolve, reject) => {

        const test =
          document.createElement(
            "video"
          );

        let finished =
          false;

        const done =
          (ok, message) => {

            if (finished) {
              return;
            }

            finished =
              true;

            test.removeAttribute(
              "src"
            );

            test.load();

            if (ok) {
              resolve(true);
            } else {
              reject(
                new Error(
                  message ||
                  "ویدئو قابل پخش نیست."
                )
              );
            }
          };

        test.preload =
          "metadata";

        test.muted =
          true;

        test.onloadedmetadata =
          () => {
            done(true);
          };

        test.onerror =
          () => {
            done(
              false,
              "مرورگر نتوانست این ویدئو را باز کند."
            );
          };

        setTimeout(
          () => {

            if (!finished) {

              done(
                false,
                "بررسی ویدئو زمان زیادی برد."
              );
            }

          },
          12000
        );

        test.src =
          source.url;

        test.load();
      }
    );
  }

    if (

        .includes(".m3u8")

      ) {

        hls =
          new Hls();

        hls.on(

  function formatTime(seconds) {

    if (
      !Number.isFinite(seconds)
    ) {
      return "00:00";
    }

    seconds =
      Math.max(
        0,
        Math.floor(seconds)
      );

    const h =
      Math.floor(
        seconds / 3600
      );

    const m =
      Math.floor(
        seconds % 3600 / 60
      );

    const s =
      seconds % 60;

    if (h > 0) {

      return (
        String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
      );
    }

    return (
      String(m).padStart(2,"0") +
      ":" +
      String(s).padStart(2,"0")
    );
  }

  function getIceServers() {

    return [
      {
        urls:
          "stun:stun.l.google.com:19302"
      },
      {
        urls:
          "stun:stun1.l.google.com:19302"

  /*
    تعیین می‌کند چه کسی Offer بسازد.

    برای هر جفت کاربر فقط یک نفر Offer می‌سازد.
    این باعث جلوگیری از Offer collision می‌شود.
  */

  function shouldCreateOffer(remoteId) {

    return (
      String(socket.id) <
      String(remoteId)
    );
  }


  async function refreshVoicePeers() {

    if (
      !voiceEnabled ||
      !localStream
    ) {
      return;
    }

    const activeIds =
      new Set(
        currentUsers
          .map(
            user => user.id
          )
          .filter(
            id =>
              id &&
              id !== socket.id
          )
      );

    /*
      اتصال‌هایی که دیگر عضو روم نیستند
      بسته می‌شوند.
    */

    for (
      const [id, pc]
      of peerConnections
    ) {

      if (
        !activeIds.has(id)
      ) {

        try {
          pc.close();
        } catch {}

        peerConnections.delete(
          id
        );
      }
    }

    /*
      ایجاد اتصال برای اعضای جدید.
    */

    for (
      const id
      of activeIds
    ) {

      if (
        !peerConnections.has(id) &&
        !creatingPeers.has(id)
      ) {

        if (
          shouldCreateOffer(id)
        ) {

          await createPeerConnection(
            id,
            true
          );
        }
      }
    }
  }


  async function createPeerConnection(
    remoteId,
    makeOffer
  ) {

    if (
      peerConnections.has(
        remoteId
      )
    ) {

      return peerConnections.get(
        remoteId
      );
    }

    if (
      creatingPeers.has(
        remoteId
      )
    ) {

      return creatingPeers.get(
        remoteId
      );
    }

    const promise =
      (async () => {

        const pc =
          new RTCPeerConnection(
            {
              iceServers:
                getIceServers()
            }
          );

        peerConnections.set(
          remoteId,
          pc
        );

        /*
          میکروفون خودمان را به Peer اضافه می‌کنیم.
        */

        if (localStream) {

          for (
            const track
            of localStream.getTracks()
          ) {

            pc.addTrack(
              track,
              localStream
            );
          }
        }

        /*
          ICE
        */

        pc.onicecandidate =
          event => {

            if (
              event.candidate
            ) {

              socket.emit(
                "voice-ice",
                {
                  target:
                    remoteId,

                  candidate:
                    event.candidate
                }
              );
            }
          };


        /*
          دریافت صدای کاربر مقابل
        */

        pc.ontrack =
          event => {

            const stream =
              event.streams &&
              event.streams[0];

            if (!stream) {
              return;
            }

            let audio =
              document.getElementById(
                "remote-audio-" +
                remoteId
              );

            if (!audio) {

              audio =
                document.createElement(
                  "audio"
                );

              audio.id =
                "remote-audio-" +
                remoteId;

              audio.autoplay =
                true;

              audio.playsInline =
                true;

              audio.setAttribute(
                "playsinline",
                ""
              );

              audio.style.display =
                "none";

              document.body.appendChild(
                audio
              );
            }

            audio.srcObject =
              stream;

            /*
              تلاش برای شروع پخش.
            */

            audio.play()
              .catch(
                error => {

                  console.warn(
                    "Remote audio autoplay blocked:",
                    error
                  );

                  /*
                    با اولین تعامل کاربر دوباره
                    play را امتحان می‌کنیم.
                  */

                  const retry =
                    () => {

                      audio.play()
                        .catch(
                          () => {}
                        );

                      document.removeEventListener(
                        "click",
                        retry
                      );

                      document.removeEventListener(
                        "touchstart",
                        retry
                      );
                    };

                  document.addEventListener(
                    "click",
                    retry,
                    {
                      once: true
                    }
                  );

                  document.addEventListener(
                    "touchstart",
                    retry,
                    {
                      once: true
                    }
                  );
                }
              );
          };


        /*
          Connection state
        */

        pc.onconnectionstatechange =
          () => {

            const state =
              pc.connectionState;

            console.log(
              "Voice connection",
              remoteId,
              state
            );

            if (
              state === "failed" ||
              state === "closed"
            ) {

              peerConnections.delete(
                remoteId
              );

              removeRemoteAudio(
                remoteId
              );

            } else if (
              state === "disconnected"
            ) {

              /*
                کمی صبر می‌کنیم؛
                ممکن است اتصال خودش برگردد.
              */

              setTimeout(
                () => {

                  const current =
                    peerConnections.get(
                      remoteId
                    );

                  if (
                    current === pc &&
                    pc.connectionState ===
                      "disconnected"
                  ) {

                    try {
                      pc.close();
                    } catch {}

                    peerConnections.delete(
                      remoteId
                    );

                    removeRemoteAudio(
                      remoteId
                    );
                  }

                },
                5000
              );
            }
          };


        /*
          Signaling state
        */

        pc.onsignalingstatechange =
          () => {

            console.log(
              "Voice signaling",
              remoteId,
              pc.signalingState
            );
          };


        /*
          اگر ما باید Offer بسازیم
        */

        if (
          makeOffer
        ) {

          const offer =
            await pc.createOffer();

          await pc.setLocalDescription(
            offer
          );

          socket.emit(
            "voice-offer",
            {
              target:
                remoteId,

              offer:
                pc.localDescription
            }
          );
        }

        return pc;

      })();

    creatingPeers.set(
      remoteId,
      promise
    );

    try {

      return await promise;

    } finally {

      creatingPeers.delete(
        remoteId
      );
    }
  }


  function removeRemoteAudio(
    remoteId
  ) {

    const audio =
      document.getElementById(
        "remote-audio-" +
        remoteId
      );

    if (audio) {

      try {
        audio.srcObject =
          null;
      } catch {}

      try {
        audio.remove();
      } catch {}
    }
  }


  function closeAllPeers() {

    for (
      const [
        remoteId,
        pc
      ]
      of peerConnections
    ) {

      try {
        pc.close();
      } catch {}

      removeRemoteAudio(
        remoteId
      );
    }

    peerConnections.clear();
    pendingIce.clear();
    creatingPeers.clear();
  }


  /* ======================================================
     VOICE OFFER
  ====================================================== */

  socket.on(
    "voice-offer",
    async data => {

      if (
        !voiceEnabled ||
        !localStream ||
        !data?.from ||
        !data?.offer
      ) {
        return;
      }

      const remoteId =
        data.from;

      /*
        اگر اتصال قبلی وجود ندارد،
        بدون Offer آن را بساز.
      */

      let pc =
        peerConnections.get(
          remoteId
        );

      if (!pc) {

        pc =
          await createPeerConnection(
            remoteId,
            false
          );
      }

      try {

        /*
          فقط وقتی Stable هستیم
          Offer طرف مقابل را قبول می‌کنیم.
        */

        if (
          pc.signalingState !==
          "stable"
        ) {

          console.warn(
            "Ignoring offer because signaling state is",
            pc.signalingState
          );

          return;
        }

        await pc.setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );

        await flushPendingIce(
          remoteId,
          pc
        );

        const answer =
          await pc.createAnswer();

        await pc.setLocalDescription(
          answer
        );

        socket.emit(
          "voice-answer",
          {
            target:
              remoteId,

            answer:
              pc.localDescription
          }
        );

      } catch (error) {

        console.error(
          "Voice offer error:",
          error
        );
      }
    }
  );


  /* ======================================================
     VOICE ANSWER
  ====================================================== */

  socket.on(
    "voice-answer",
    async data => {

      if (
        !data?.from ||
        !data?.answer
      ) {
        return;
      }

      const remoteId =
        data.from;

      const pc =
        peerConnections.get(
          remoteId
        );

      if (!pc) {
        return;
      }

      try {

        if (
          pc.signalingState !==
          "have-local-offer"
        ) {

          console.warn(
            "Ignoring answer. Signaling state:",
            pc.signalingState
          );

          return;
        }

        await pc.setRemoteDescription(
          new RTCSessionDescription(
            data.answer
          )
        );

        await flushPendingIce(
          remoteId,
          pc
        );

      } catch (error) {

        console.error(
          "Voice answer error:",
          error
        );
      }
    }
  );


  /* ======================================================
     ICE
  ====================================================== */

  socket.on(
    "voice-ice",
    async data => {

      if (
        !data?.from ||
        !data?.candidate
      ) {
        return;
      }

      const remoteId =
        data.from;

      const pc =
        peerConnections.get(
          remoteId
        );

      /*
        اگر Peer هنوز ساخته نشده،
        Candidate را نگه می‌داریم.
      */

      if (!pc) {

        if (
          !pendingIce.has(
            remoteId
          )
        ) {

          pendingIce.set(
            remoteId,
            []
          );
        }

        pendingIce
          .get(remoteId)
          .push(
            data.candidate
          );

        return;
      }

      /*
        اگر RemoteDescription هنوز نیامده،
        Candidate را موقتاً ذخیره می‌کنیم.
      */

      if (
        !pc.remoteDescription
      ) {

        if (
          !pendingIce.has(
            remoteId
          )
        ) {

          pendingIce.set(
            remoteId,
            []
          );
        }

        pendingIce
          .get(remoteId)
          .push(
            data.candidate
          );

        return;
      }

      try {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      } catch (error) {

        console.error(
          "ICE error:",
          error
        );
      }
    }
  );


  async function flushPendingIce(
    remoteId,
    pc
  ) {

    const list =
      pendingIce.get(
        remoteId
      );

    if (!list?.length) {
      return;
    }

    pendingIce.delete(
      remoteId
    );

    for (
      const candidate
      of list
    ) {

      try {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      } catch (error) {

        console.error(
          "Pending ICE error:",
          error
        );
      }
    }
  }


  /* ======================================================
     VOICE STATE
  ====================================================== */

  socket.on(
    "voice-state",
    data => {

      /*
        وقتی یک کاربر Voice را روشن می‌کند،
        اگر ما هم Voice روشن داشته باشیم،
        Mesh را دوباره بررسی می‌کنیم.
      */

      if (
        voiceEnabled
      ) {

        refreshVoicePeers();
      }
    }
  );


  /* ======================================================
     DISCONNECT
  ====================================================== */

  socket.on(
    "disconnect",
    () => {

      closeAllPeers();

      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            track => {
              track.stop();
            }
          );

        localStream =
          null;
      }

      voiceEnabled =
        false;

      updateVoiceButton();
    }
  );


  /* ======================================================
     MOBILE AUDIO UNLOCK
     
     بعضی مرورگرهای موبایل پخش صدای Remote Audio
     را تا اولین تعامل کاربر محدود می‌کنند.
  ====================================================== */

  function unlockRemoteAudio() {

    document
      .querySelectorAll(
        "audio[id^='remote-audio-']"
      )
      .forEach(
        audio => {

          if (
            audio.srcObject
          ) {

            audio.play()
              .catch(
                () => {}
              );
          }
        }
      );
  }


  document.addEventListener(
    "click",
    unlockRemoteAudio
  );

  document.addEventListener(
    "touchstart",
    unlockRemoteAudio
  );


  /* ======================================================
     INITIAL
  ====================================================== */

  updateVoiceButton();

</script>

</body>
</html>
