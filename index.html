<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>باهم ببینیم - Stream</title>

  <script src="/socket.io/socket.io.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090909;
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at top,
          #222 0%,
          #0b0b0b 45%,
          #050505 100%
        );
    }

    .login-card {
      width: min(440px, 100%);
      padding: 30px;
      border-radius: 24px;
      background: rgba(25, 25, 25, 0.96);
      border: 1px solid #333;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #444;
      border-radius: 13px;
      background: #111;
      color: #fff;
      padding: 0 14px;
      outline: none;
      font-size: 15px;
    }

    .field input:focus {
      border-color: #777;
    }

    .host-option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      padding: 13px;
      border-radius: 13px;
      background: #151515;
      border: 1px solid #333;
      cursor: pointer;
    }

    .host-option input {
      width: 19px;
      height: 19px;
    }

    #joinBtn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }

    #joinBtn:active {
      transform: scale(.98);
    }

    #loginError {
      margin-top: 14px;
      color: #ff7777;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    /* =========================
       APP
    ========================= */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #080808;
    }

    #topbar {
      height: 58px;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      background: #111;
      border-bottom: 1px solid #292929;
      z-index: 20;
    }

    .app-title {
      font-weight: 900;
      white-space: nowrap;
    }

    .room-badge,
    .role-badge {
      padding: 6px 9px;
      border-radius: 999px;
      background: #222;
      color: #ccc;
      font-size: 12px;
      white-space: nowrap;
    }

    .role-badge.host {
      background: #303030;
      color: #fff;
    }

    .top-spacer {
      flex: 1;
    }

    .top-btn {
      height: 38px;
      padding: 0 12px;
      border: 1px solid #393939;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
    }

    .top-btn:hover {
      background: #242424;
    }

    /* =========================
       MAIN
    ========================= */

    #main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 0;
    }

    #videoSection {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    #videoWrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #videoMessage {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777;
      font-size: 16px;
      pointer-events: none;
      text-align: center;
      padding: 30px;
    }

    #playOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .35);
      z-index: 5;
    }

    #playOverlay button {
      border: 0;
      border-radius: 50%;
      width: 76px;
      height: 76px;
      background: rgba(255,255,255,.95);
      color: #000;
      font-size: 30px;
    }

    #videoControls {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: #111;
      border-top: 1px solid #222;
    }

    .control-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #1c1c1c;
      color: #fff;
      font-size: 16px;
    }

    #progress {
      flex: 1;
      min-width: 0;
      accent-color: #fff;
    }

    #timeLabel {
      color: #aaa;
      font-size: 12px;
      min-width: 80px;
      text-align: center;
      direction: ltr;
    }

    /* =========================
       CHAT
    ========================= */

    #chatSection {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #111;
      border-right: 1px solid #292929;
    }

    #chatHeader {
      height: 52px;
      min-height: 52px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #292929;
    }

    #chatHeader strong {
      font-size: 15px;
    }

    #userCount {
      color: #888;
      font-size: 12px;
    }

    #users {
      padding: 8px 12px;
      border-bottom: 1px solid #292929;
      max-height: 120px;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 13px;
    }

    .user-role {
      color: #888;
      font-size: 11px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
    }

    .message {
      margin-bottom: 12px;
      word-break: break-word;
    }

    .message-name {
      font-size: 11px;
      color: #888;
      margin-bottom: 3px;
    }

    .message-text {
      display: inline-block;
      max-width: 90%;
      padding: 9px 11px;
      border-radius: 12px;
      background: #222;
      line-height: 1.5;
      font-size: 14px;
    }

    #chatForm {
      display: flex;
      gap: 7px;
      padding: 9px;
      border-top: 1px solid #292929;
    }

    #chatInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid #393939;
      border-radius: 11px;
      background: #181818;
      color: #fff;
      outline: none;
      padding: 0 11px;
    }

    #chatSend {
      width: 48px;
      height: 42px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    /* =========================
       SOURCE PANEL
    ========================= */

    #sourcePanel {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0,0,0,.75);
    }

    .source-card {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #161616;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 20px;
    }

    .source-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .source-title h3 {
      margin: 0;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #333;
      border-radius: 9px;
      background: #222;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 15px;
    }

    .tab {
      flex: 1;
      height: 42px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #202020;
      color: #aaa;
    }

    .tab.active {
      background: #fff;
      color: #000;
    }

    .source-content input[type="text"] {
      width: 100%;
      height: 45px;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      background: #0f0f0f;
      color: #fff;
      padding: 0 11px;
      outline: none;
    }

    .file-input {
      width: 100%;
      padding: 18px;
      border: 1px dashed #555;
      border-radius: 12px;
      text-align: center;
      color: #aaa;
    }

    .source-action {
      width: 100%;
      height: 46px;
      margin-top: 12px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    #uploadProgressWrap {
      margin-top: 14px;
      display: none;
    }

    #uploadProgress {
      width: 100%;
    }

    #uploadStatus {
      margin-top: 7px;
      color: #999;
      font-size: 12px;
      text-align: center;
    }

    /* =========================
       TOAST
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 300;
      padding: 11px 16px;
      border-radius: 12px;
      background: #eee;
      color: #000;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      max-width: 90%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 850px) {

      #main {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 300px;
      }

      #chatSection {
        border-right: 0;
        border-top: 1px solid #292929;
      }

      .app-title {
        display: none;
      }

      #topbar {
        overflow-x: auto;
      }

      .room-badge,
      .role-badge {
        flex-shrink: 0;
      }
    }

    @media (orientation: landscape) and (max-width: 1000px) {

      #main {
        grid-template-columns:
          minmax(0, 1fr)
          310px;

        grid-template-rows: 1fr;
      }

      #chatSection {
        border-top: 0;
        border-right: 1px solid #292929;
      }
    }

    /* =========================
       FULLSCREEN
    ========================= */

    #videoSection:fullscreen {
      width: 100vw;
      height: 100vh;
    }

    #videoSection:fullscreen #videoWrap {
      height: calc(100vh - 52px);
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="logo">
        باهم ببینیم
      </div>

      <div class="subtitle">
        با دوستات همزمان فیلم ببین
      </div>

      <div class="field">

        <label>
          نام شما
        </label>

        <input
          id="nameInput"
          type="text"
          maxlength="30"
          autocomplete="off"
          placeholder="مثلاً Taha"
        >

      </div>

      <div class="field">

        <label>
          کد روم
        </label>

        <input
          id="roomInput"
          type="text"
          maxlength="30"
          autocomplete="off"
          placeholder="مثلاً ABC123"
        >

      </div>

      <label class="host-option">

        <input
          id="hostCheckbox"
          type="checkbox"
        >

        <span>
          ورود به عنوان Host
        </span>

      </label>

      <button id="joinBtn">
        ورود به روم
      </button>

      <div id="loginError"></div>

    </div>

  </section>


  <!-- =========================
       APP
  ========================= -->

  <section
    id="app"
    class="hidden"
  >

    <header id="topbar">

      <div class="app-title">
        باهم ببینیم
      </div>

      <div
        id="roomBadge"
        class="room-badge"
      >
        ROOM
      </div>

      <div
        id="roleBadge"
        class="role-badge"
      >
        Guest
      </div>

      <div class="top-spacer"></div>

      <button
        id="voiceBtn"
        class="top-btn"
      >
        🎙️ صدا
      </button>

      <button
        id="sourceBtn"
        class="top-btn hidden"
      >
        🎬 ویدئو
      </button>

      <button
        id="fullscreenBtn"
        class="top-btn"
      >
        ⛶
      </button>

    </header>


    <main id="main">

      <!-- =====================
           VIDEO
      ====================== -->

      <section id="videoSection">

        <div id="videoWrap">

          <video
            id="video"
            playsinline
            preload="metadata"
          ></video>

          <div id="videoMessage">
            هنوز ویدئویی انتخاب نشده است.
          </div>

          <div
            id="playOverlay"
            class="hidden"
          >
            <button id="manualPlayBtn">
              ▶
            </button>
          </div>

        </div>


        <div id="videoControls">

          <button
            id="playBtn"
            class="control-btn"
          >
            ▶
          </button>

          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
          >

          <div id="timeLabel">
            00:00 / 00:00
          </div>

        </div>

      </section>


      <!-- =====================
           CHAT
      ====================== -->

      <section id="chatSection">

        <div id="chatHeader">

          <strong>
            چت روم
          </strong>

          <span id="userCount">
            0/4
          </span>

        </div>


        <div id="users"></div>


        <div id="messages"></div>


        <form id="chatForm">

          <input
            id="chatInput"
            type="text"
            maxlength="500"
            autocomplete="off"
            placeholder="پیام..."
          >

          <button id="chatSend">
            ➤
          </button>

        </form>

      </section>

    </main>

  </section>


  <!-- =========================
       SOURCE PANEL
  ========================= -->

  <div
    id="sourcePanel"
    class="hidden"
  >

    <div class="source-card">

      <div class="source-title">

        <h3>
          انتخاب ویدئو
        </h3>

        <button
          id="closeSource"
          class="close-btn"
        >
          ✕
        </button>

      </div>


      <div class="tabs">

        <button
          id="uploadTab"
          class="tab active"
        >
          آپلود فایل
        </button>

        <button
          id="linkTab"
          class="tab"
        >
          لینک ویدئو
        </button>

      </div>


      <div
        id="uploadContent"
        class="source-content"
      >

        <input
          id="videoFile"
          class="file-input"
          type="file"
          accept="video/*,.mkv,.mp4,.webm,.mov,.avi"
        >

        <button
          id="uploadBtn"
          class="source-action"
        >
          آپلود ویدئو
        </button>

        <div id="uploadProgressWrap">

          <progress
            id="uploadProgress"
            value="0"
            max="100"
          ></progress>

          <div id="uploadStatus">
            آماده آپلود
          </div>

        </div>

      </div>


      <div
        id="linkContent"
        class="source-content hidden"
      >

        <input
          id="videoUrl"
          type="text"
          placeholder="https://example.com/video.mp4"
        >

        <button
          id="linkBtn"
          class="source-action"
        >
          پخش این لینک
        </button>

      </div>

    </div>

  </div>


  <div id="toast"></div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    // =====================================================
    // ثابت‌ها
    // =====================================================

    const FIXED_HOST_CODE =
      "tbolandghamat";

    const socket =
      io();

    let roomCode = "";
    let myName = "";
    let myRole = "guest";

    let currentSource = null;

    let hls = null;

    let isApplyingRemotePlayback = false;

    let currentUsers = [];

    let voiceEnabled = false;

    const peerConnections =
      new Map();

    const remoteAudios =
      new Map();


    // =====================================================
    // Elements
    // =====================================================

    const loginScreen =
      document.getElementById(
        "loginScreen"
      );

    const app =
      document.getElementById(
        "app"
      );

    const nameInput =
      document.getElementById(
        "nameInput"
      );

    const roomInput =
      document.getElementById(
        "roomInput"
      );

    const hostCheckbox =
      document.getElementById(
        "hostCheckbox"
      );

    const joinBtn =
      document.getElementById(
        "joinBtn"
      );

    const loginError =
      document.getElementById(
        "loginError"
      );

    const roomBadge =
      document.getElementById(
        "roomBadge"
      );

    const roleBadge =
      document.getElementById(
        "roleBadge"
      );

    const sourceBtn =
      document.getElementById(
        "sourceBtn"
      );

    const voiceBtn =
      document.getElementById(
        "voiceBtn"
      );

    const fullscreenBtn =
      document.getElementById(
        "fullscreenBtn"
      );

    const videoSection =
      document.getElementById(
        "videoSection"
      );

    const video =
      document.getElementById(
        "video"
      );

    const videoMessage =
      document.getElementById(
        "videoMessage"
      );

    const playOverlay =
      document.getElementById(
        "playOverlay"
      );

    const manualPlayBtn =
      document.getElementById(
        "manualPlayBtn"
      );

    const playBtn =
      document.getElementById(
        "playBtn"
      );

    const progress =
      document.getElementById(
        "progress"
      );

    const timeLabel =
      document.getElementById(
        "timeLabel"
      );

    const users =
      document.getElementById(
        "users"
      );

    const userCount =
      document.getElementById(
        "userCount"
      );

    const messages =
      document.getElementById(
        "messages"
      );

    const chatForm =
      document.getElementById(
        "chatForm"
      );

    const chatInput =
      document.getElementById(
        "chatInput"
      );

    const sourcePanel =
      document.getElementById(
        "sourcePanel"
      );

    const closeSource =
      document.getElementById(
        "closeSource"
      );

    const uploadTab =
      document.getElementById(
        "uploadTab"
      );

    const linkTab =
      document.getElementById(
        "linkTab"
      );

    const uploadContent =
      document.getElementById(
        "uploadContent"
      );

    const linkContent =
      document.getElementById(
        "linkContent"
      );

    const videoFile =
      document.getElementById(
        "videoFile"
      );

    const uploadBtn =
      document.getElementById(
        "uploadBtn"
      );

    const linkBtn =
      document.getElementById(
        "linkBtn"
      );

    const videoUrl =
      document.getElementById(
        "videoUrl"
      );

    const uploadProgressWrap =
      document.getElementById(
        "uploadProgressWrap"
      );

    const uploadProgress =
      document.getElementById(
        "uploadProgress"
      );

    const uploadStatus =
      document.getElementById(
        "uploadStatus"
      );

    const toast =
      document.getElementById(
        "toast"
      );


    // =====================================================
    // Toast
    // =====================================================

    let toastTimer = null;

    function showToast(text) {

      toast.textContent =
        text;

      toast.classList.add(
        "show"
      );

      clearTimeout(
        toastTimer
      );

      toastTimer =
        setTimeout(() => {
          toast.classList.remove(
            "show"
          );
        }, 3000);
    }


    // =====================================================
    // Login
    // =====================================================

    joinBtn.addEventListener(
      "click",
      joinRoom
    );

    nameInput.addEventListener(
      "keydown",
      e => {
        if (
          e.key === "Enter"
        ) {
          joinRoom();
        }
      }
    );

    roomInput.addEventListener(
      "keydown",
      e => {
        if (
          e.key === "Enter"
        ) {
          joinRoom();
        }
      }
    );


    function joinRoom() {

      loginError.textContent =
        "";

      const name =
        nameInput.value
          .trim();

      const room =
        roomInput.value
          .trim()
          .toUpperCase();

      const wantsHost =
        hostCheckbox.checked;

      if (!name) {

        loginError.textContent =
          "نام خود را وارد کنید.";

        return;
      }

      if (!room) {

        loginError.textContent =
          "کد روم را وارد کنید.";

        return;
      }

      myName =
        name;

      roomCode =
        room;

      joinBtn.disabled =
        true;

      joinBtn.textContent =
        "در حال ورود...";

      socket.emit(
        "join-room",
        {
          roomCode:
            room,

          name:
            name,

          // فقط وقتی Host انتخاب شده،
          // کد ثابت را خودکار ارسال می‌کنیم.
          hostCode:
            wantsHost
              ? FIXED_HOST_CODE
              : "",

          wantsHost:
            wantsHost
        }
      );
    }


    // =====================================================
    // Joined
    // =====================================================

    socket.on(
      "joined-room",
      data => {

        myRole =
          data.role ||
          "guest";

        roomCode =
          data.roomCode ||
          roomCode;

        currentUsers =
          data.users ||
          [];

        loginScreen.classList.add(
          "hidden"
        );

        app.classList.remove(
          "hidden"
        );

    // =====================================================
    // Validate source
    // =====================================================

    async function validateSource(
      source
    ) {

      const url =
        source.url;

      const lower =
        url.toLowerCase();

      if (
        lower.includes(".m3u8")
      ) {
        return true;
      }

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const test =
            document.createElement(
              "video"
            );

          let finished =
            false;

          const done = (
            ok,
            message
          ) => {

            if (finished) {
              return;
            }

            finished =
              true;

            test.removeAttribute(
              "src"
            );

            test.load();

            if (ok) {
              resolve(true);
            } else {
              reject(
                new Error(
                  message ||
                  "ویدئو قابل پخش نیست."
                )
              );
            }
          };

          test.preload =
            "metadata";

          test.muted =
            true;

          test.playsInline =
            true;

          test.onloadedmetadata =
            () => {

              done(
                true
              );
            };

          test.onerror =
            () => {

              done(
                false,
                "مرورگر نتوانست این ویدئو را باز کند."
              );
            };

          setTimeout(
            () => {

              if (
                !finished
              ) {

                done(
                  false,
                  "بررسی ویدئو زمان زیادی برد یا لینک قابل دسترسی نیست."
                );
              }

            },
            12000
          );

          test.src =
            url;

          test.load();
        }
      );
    }


    // =====================================================
    // Load source
    // =====================================================

    function loadSource(
      source
    ) {

      if (!source?.url) {
        return;
      }

      destroyHls();

      video.pause();

      video.removeAttribute(
        "src"
      );

      video.load();

      videoMessage.textContent =
        "در حال بارگذاری ویدئو...";

      playOverlay.classList.add(
        "hidden"
      );

      const url =
        source.url;

      const lower =
        url.toLowerCase();

      // HLS
      if (
        lower.includes(".m3u8")
      ) {

        if (
          window.Hls &&
          Hls.isSupported()
        ) {

          hls =
            new Hls();

          hls.loadSource(
            url
          );

          hls.attachMedia(
            video
          );

          hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

              videoMessage.classList.add(
                "hidden"
              );
            }
          );

          hls.on(
            Hls.Events.ERROR,
            (_, data) => {

              if (
                data?.fatal
              ) {

                videoMessage.classList.remove(
                  "hidden"
                );

                videoMessage.textContent =
                  "خطا در پخش HLS.";
              }
            }
          );

        } else if (
          video.canPlayType(
            "application/vnd.apple.mpegurl"
          )
        ) {

          video.src =
            url;

          videoMessage.classList.add(
            "hidden"
          );

        } else {

          videoMessage.textContent =
            "مرورگر شما از HLS پشتیبانی نمی‌کند.";

          return;
        }

      } else {

        video.src =
          url;

        videoMessage.classList.add(
          "hidden"
        );
      }

      video.load();

      video.addEventListener(
        "loadedmetadata",
        () => {

          updateTimeUI();

        },
        {
          once: true
        }
      );
    }


    function destroyHls() {

      if (hls) {

          hls.destroy();
        } catch {}

        hls =

      }
    }

    function applyPlayback(
      state
    ) {

      if (
        !state ||
        !Number.isFinite(
          Number(state.time)
        )
      ) {
        return;

      const targetTime =
        Number(state.time);

      isApplyingRemotePlayback =
        true;

      try {

        if (
          Math.abs(
            video.currentTime -
            targetTime
          ) > 0.7
        ) {

          video.currentTime =
            targetTime;

        if (

            .catch(() => {

              playOverlay.classList.remove(
                "hidden"

        } else {

          video.pause();
        }

      } finally {

        setTimeout(
          () => {
            isApplyingRemotePlayback =
              false;
          },
          100
        );
      }
    }

    function formatTime(
      seconds
    ) {

      if (
        !Number.isFinite(
          seconds
        )
      ) {
        return "00:00";
      }

      seconds =
        Math.max(
          0,
          Math.floor(seconds)
        );

      const h =
        Math.floor(
          seconds / 3600
        );

      const m =
        Math.floor(
          (seconds % 3600) / 60
        );

      const s =
        seconds % 60;

      if (h > 0) {

        return (
          String(h).padStart(
            2,
            "0"
          ) +
          ":" +
          String(m).padStart(
            2,
            "0"
          ) +
          ":" +
          String(s).padStart(
            2,
            "0"
          )
        );

      }

      return (
        String(m).padStart(
          2,
          "0"
        ) +
        ":" +
        String(s).padStart(
          2,
          "0"
        )
      );
    }

    function disableVoice() {

        localStream

          .getTracks()
          .forEach(

            }

        localStream =

      peerConnections.forEach(

      remoteAudios.forEach(

    // =====================================================
    // WebRTC
    // =====================================================

    async function updateVoiceConnections() {

      if (
        !voiceEnabled ||
        !localStream
      ) {
        return;
      }

      for (
        const user of currentUsers
      ) {

        if (
          !user ||
          user.id === socket.id
        ) {
          continue;
        }

        // برای جلوگیری از ایجاد دو اتصال،
        // فقط یکی از دو طرف Offer را می‌سازد.
        if (
          socket.id < user.id
        ) {

          await createPeer(
            user.id,
            true
          );
        }
      }
    }


    async function createPeer(
      targetId,
      createOffer
    ) {

      let pc =
        peerConnections.get(
          targetId
        );

      if (pc) {
        return pc;
      }

      pc =
        new RTCPeerConnection(
          {
            iceServers: [
              {
                urls:
                  "stun:stun.l.google.com:19302"
              },
              {
                urls:
                  "stun:stun1.l.google.com:19302"
              }
            ]
          }
        );

      peerConnections.set(
        targetId,
        pc
      );

      if (
        localStream
      ) {

        localStream
          .getTracks()
          .forEach(
            track => {

              pc.addTrack(
                track,
                localStream
              );
            }
          );
      }

      pc.onicecandidate =
        event => {

          if (
            event.candidate
          ) {

            socket.emit(
              "voice-ice",
              {
                target:
                  targetId,

                candidate:
                  event.candidate
              }
            );
          }
        };


      pc.ontrack =
        event => {

          const stream =
            event.streams[0];

          if (!stream) {
            return;
          }

          let audio =
            remoteAudios.get(
              targetId
            );

          if (!audio) {

            audio =
              document.createElement(
                "audio"
              );

            audio.autoplay =
              true;

            audio.playsInline =
              true;

            audio.controls =
              false;

            audio.style.display =
              "none";

            document.body.appendChild(
              audio
            );

            remoteAudios.set(
              targetId,
              audio
            );
          }

          audio.srcObject =
            stream;

          audio.play()
            .catch(() => {});
        };


      pc.onconnectionstatechange =
        () => {

          if (
            pc.connectionState ===
              "failed" ||
            pc.connectionState ===
              "closed" ||
            pc.connectionState ===
              "disconnected"
          ) {

            peerConnections.delete(
              targetId
            );

            const audio =
              remoteAudios.get(
                targetId
              );

            if (audio) {

              try {
                audio.remove();
              } catch {}

              remoteAudios.delete(
                targetId
              );
            }
          }
        };


      if (
        createOffer
      ) {

        try {

          const offer =
            await pc.createOffer();

          await pc.setLocalDescription(
            offer
          );

          socket.emit(
            "voice-offer",
            {
              target:
                targetId,

              offer:
                pc.localDescription
            }
          );

        } catch (
          error
        ) {

          console.error(
            error
          );
        }
      }

      return pc;
    }


    // =====================================================
    // Voice Offer
    // =====================================================

    socket.on(
      "voice-offer",
      async data => {

        if (
          !data?.from ||
          !data?.offer
        ) {
          return;
        }

        if (
          !voiceEnabled
        ) {
          return;
        }

        let pc =
          peerConnections.get(
            data.from
          );

        if (!pc) {

          pc =
            await createPeer(
              data.from,
              false
            );
        }

        try {

          await pc.setRemoteDescription(
            new RTCSessionDescription(
              data.offer
            )
          );

          const answer =
            await pc.createAnswer();

          await pc.setLocalDescription(
            answer
          );

          socket.emit(
            "voice-answer",
            {
              target:
                data.from,

              answer:
                pc.localDescription
            }
          );

        } catch (
          error
        ) {

          console.error(
            error
          );
        }
      }
    );


    // =====================================================
    // Voice Answer
    // =====================================================

    socket.on(
      "voice-answer",
      async data => {

        if (
          !data?.from ||
          !data?.answer
        ) {
          return;
        }

        const pc =
          peerConnections.get(
            data.from
          );

        if (!pc) {
          return;
        }

        try {

          await pc.setRemoteDescription(
            new RTCSessionDescription(
              data.answer
            )
          );

        } catch (
          error
        ) {

          console.error(
            error
          );
        }
      }
    );


    // =====================================================
    // ICE
    // =====================================================

    socket.on(
      "voice-ice",
      async data => {

        if (
          !data?.from ||
          !data?.candidate
        ) {
          return;
        }

        const pc =
          peerConnections.get(
            data.from
          );

        if (!pc) {
          return;
        }

        try {

          await pc.addIceCandidate(
            new RTCIceCandidate(
              data.candidate
            )
          );

        } catch (
          error
        ) {

          console.error(
            error
          );
        }
      }
    );


    socket.on(
      "voice-state",
      data => {

        if (!data) {
          return;
        }

        // اگر کاربر دیگری صدا را روشن کرد،
        // اتصال صوتی را تازه‌سازی می‌کنیم.
        if (
          voiceEnabled
        ) {

          updateVoiceConnections();
        }
      }
    );


    // =====================================================
    // Cleanup
    // =====================================================

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          localStream
        ) {

          localStream
            .getTracks()
            .forEach(
              track => {
                track.stop();
              }
            );
        }
      }
    );


    // =====================================================
    // Initial UI
    // =====================================================

    updateVoiceButton();

  </script>

</body>
</html>
